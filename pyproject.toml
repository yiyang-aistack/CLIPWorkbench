[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipworkbench"
version = "0.1.0"
description = "Multimodal AI desktop workbench: CLIP zero-shot, linear probe, LoRA fine-tuning, ONNX export, FastAPI."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "CLIPWorkbench Contributors"}]
keywords = ["clip", "vision-language", "fine-tuning", "lora", "onnx", "fastapi", "pyside6"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0",
    "transformers>=4.30",
    "pillow>=9.0",
    "peft>=0.5",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "python-multipart>=0.0.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.60",
    "scikit-learn>=1.2",
    "numpy>=1.24",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
onnx = [
    "onnx>=1.14",
    "onnxruntime>=1.15",
    "onnxconverter-common>=1.13",
    "onnxscript>=0.1.0",
]
dev = ["pytest>=7.0", "ruff>=0.1", "mypy>=1.5"]
all = ["clipworkbench[gui,onnx,dev]"]

[project.scripts]
clipworkbench = "clipworkbench.cli:main"

[project.urls]
"Homepage" = "https://github.com/yiyang-aistack/CLIPWorkbench"
"Repository" = "https://github.com/yiyang-aistack/CLIPWorkbench"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]